# =============================================================
# Configuración principal — Minimal Mistakes
# =============================================================

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
theme_skin: "default"

title: "Humans on AIr"
description: "Ciclo de charlas sobre humanidades, lenguaje y tecnología"
url: "https://uchass-ugr.github.io"
baseurl: "/humans-on-air"

locale: "es-ES"
logo: "/assets/images/logo_combo.png"

# ----- Navegación principal -----
# (se define en _data/navigation.yml)

# ----- Opciones de lectura -----
read_time: false
comments: false
share: false
related: false

# ----- Plugins -----
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

# ----- Sass -----
sass:
  sass_dir: _sass
  style: compressed

# ----- Exclusiones -----
exclude:
  - "*.gemspec"
  - "Gemfile"
  - "Gemfile.lock"
  - README.md
